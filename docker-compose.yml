
services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ai_admin_backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    expose:
      - "5000"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: ai_admin_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
